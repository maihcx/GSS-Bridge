<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="speckitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="graphifyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="superpowersGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="bridgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  <rect width="1200" height="600" fill="url(#mintGlow)"/>
  <rect width="1200" height="600" fill="url(#blueGlow)"/>
  <rect width="1200" height="600" fill="url(#cyanGlow)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Top Border Accent -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#speckitGrad)"/>

  <!-- ================= LEFT SIDE: HERO TYPOGRAPHY ================= -->
  <g transform="translate(80, 85)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <circle cx="16" cy="17" r="5" fill="#16a34a"/>
    <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d" letter-spacing="1">THE GOLDEN TRIANGLE</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#0f172a" letter-spacing="-1.5">
      GSS-Bridge
    </text>

    <!-- Subtitle -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#2563eb" letter-spacing="-0.5">
      Graphify · Spec-Kit · Superpowers
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="175" x2="440" y2="175" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- The 3 Pillars Manifesto -->
    <g transform="translate(0, 210)">
      <!-- Item 1: Spec-Kit -->
      <g transform="translate(0, 0)">
        <circle cx="12" cy="10" r="10" fill="#10b981" fill-opacity="0.15"/>
        <path d="M9 10 L11 12 L15 8" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
        <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Spec-Kit:</text>
        <text x="110" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Defines <tspan font-weight="600" fill="#059669">WHAT</tspan> (Governance &amp; Specs)</text>
      </g>

      <!-- Item 2: Graphify -->
      <g transform="translate(0, 42)">
        <circle cx="12" cy="10" r="10" fill="#06b6d4" fill-opacity="0.15"/>
        <path d="M8 10 L12 6 L16 10 L12 14 Z" fill="none" stroke="#0891b2" stroke-width="1.8"/>
        <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Graphify:</text>
        <text x="110" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Reveals <tspan font-weight="600" fill="#0891b2">WHERE</tspan> (Topology &amp; Context)</text>
      </g>

      <!-- Item 3: Superpowers -->
      <g transform="translate(0, 84)">
        <circle cx="12" cy="10" r="10" fill="#6366f1" fill-opacity="0.15"/>
        <path d="M13 5 L9 11 L12 11 L11 15 L15 9 L12 9 Z" fill="#4f46e5"/>
        <text x="32" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Superpowers:</text>
        <text x="145" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Enforces <tspan font-weight="600" fill="#4f46e5">HOW</tspan> (TDD Discipline)</text>
      </g>
    </g>

    <!-- Feature Tags -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="105" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">TDD Discipline</text>

      <rect x="115" y="0" width="125" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="127" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">Blast Radius [P]</text>

      <rect x="250" y="0" width="120" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="262" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">Subagent Scoped</text>
    </g>
  </g>

  <!-- ================= RIGHT SIDE: ARCHITECTURAL TRINITY BRIDGE ================= -->
  <g transform="translate(630, 40)">
    <!-- Circuit lines connecting the components -->
    <path d="M 120 180 Q 240 280 240 370" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,6" stroke-opacity="0.6"/>
    <path d="M 370 180 Q 240 280 240 370" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6,6" stroke-opacity="0.6"/>
    <path d="M 120 180 Q 245 130 370 180" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>

    <!-- Architectural Suspension Bridge Silhouette in Background -->
    <g transform="translate(110, 110)" opacity="0.35">
      <!-- Bridge Towers -->
      <path d="M 30 140 L 30 20 L 40 20 L 40 140 Z" fill="#334155"/>
      <path d="M 230 140 L 230 20 L 240 20 L 240 140 Z" fill="#334155"/>
      <!-- Main Suspension Cables -->
      <path d="M -20 70 Q 35 20 135 100 Q 235 20 290 70" fill="none" stroke="#334155" stroke-width="4"/>
      <!-- Vertical Suspenders -->
      <line x1="70" y1="62" x2="70" y2="140" stroke="#475569" stroke-width="1.5"/>
      <line x1="100" y1="88" x2="100" y2="140" stroke="#475569" stroke-width="1.5"/>
      <line x1="135" y1="100" x2="135" y2="140" stroke="#475569" stroke-width="1.5"/>
      <line x1="170" y1="88" x2="170" y2="140" stroke="#475569" stroke-width="1.5"/>
      <line x1="200" y1="62" x2="200" y2="140" stroke="#475569" stroke-width="1.5"/>
      <!-- Deck -->
      <rect x="-30" y="138" width="330" height="6" fill="#1e293b" rx="2"/>
    </g>

    <!-- Central Energy Spark (Golden Triangle Center) -->
    <g transform="translate(245, 235)" filter="url(#bridgeGlow)">
      <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="0" cy="0" r="22" fill="#fef3c7"/>
      <!-- Lightning Icon -->
      <path d="M 2 -12 L -6 1 L 0 1 L -2 12 L 8 -1 L 2 -1 Z" fill="#d97706"/>
    </g>

    <!-- CARD 1: SPEC-KIT (Top Left) -->
    <g transform="translate(10, 80)" filter="url(#cardShadow)">
      <rect width="210" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <!-- Card Top Accent -->
      <path d="M 0 16 Q 0 0 16 0 L 194 0 Q 210 0 210 16 L 210 32 L 0 32 Z" fill="url(#speckitGrad)"/>
      <circle cx="16" cy="16" r="4" fill="#ffffff"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">SPEC-KIT</text>

      <!-- Document Icon -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="34" height="44" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
        <line x1="8" y1="12" x2="26" y2="12" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="20" x2="22" y2="20" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="28" x2="18" y2="28" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="66" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Governance</text>
      <text x="66" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#059669">Single Truth</text>

      <!-- File Badges -->
      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="52" height="20" rx="4" fill="#f1f5f9"/>
        <text x="7" y="14" font-family="monospace" font-size="10" fill="#475569">spec.md</text>

        <rect x="58" y="0" width="52" height="20" rx="4" fill="#f1f5f9"/>
        <text x="64" y="14" font-family="monospace" font-size="10" fill="#475569">plan.md</text>

        <rect x="116" y="0" width="56" height="20" rx="4" fill="#f1f5f9"/>
        <text x="122" y="14" font-family="monospace" font-size="10" fill="#475569">tasks.md</text>
      </g>
    </g>

    <!-- CARD 2: SUPERPOWERS (Top Right) -->
    <g transform="translate(270, 80)" filter="url(#cardShadow)">
      <rect width="210" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <!-- Card Top Accent -->
      <path d="M 0 16 Q 0 0 16 0 L 194 0 Q 210 0 210 16 L 210 32 L 0 32 Z" fill="url(#superpowersGrad)"/>
      <circle cx="16" cy="16" r="4" fill="#ffffff"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">SUPERPOWERS</text>

      <!-- Terminal Prompt Icon -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="34" height="44" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
        <text x="6" y="18" font-family="monospace" font-size="12" font-weight="800" fill="#4f46e5">&gt;_</text>
        <line x1="8" y1="28" x2="24" y2="28" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="66" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Discipline</text>
      <text x="66" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#4f46e5">TDD + Review</text>

      <!-- Badge Tags -->
      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="80" height="20" rx="4" fill="#f1f5f9"/>
        <text x="8" y="14" font-family="monospace" font-size="10" fill="#475569">Red-Green</text>

        <rect x="86" y="0" width="84" height="20" rx="4" fill="#f1f5f9"/>
        <text x="94" y="14" font-family="monospace" font-size="10" fill="#475569">Subagents</text>
      </g>
    </g>

    <!-- CARD 3: GRAPHIFY (Bottom Center - The Foundation) -->
    <g transform="translate(140, 310)" filter="url(#cardShadow)">
      <rect width="210" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <!-- Card Top Accent -->
      <path d="M 0 16 Q 0 0 16 0 L 194 0 Q 210 0 210 16 L 210 32 L 0 32 Z" fill="url(#graphifyGrad)"/>
      <circle cx="16" cy="16" r="4" fill="#ffffff"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">GRAPHIFY</text>

      <!-- Graph Network Icon -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="34" height="44" rx="4" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
        <circle cx="10" cy="14" r="3" fill="#0284c7"/>
        <circle cx="24" cy="22" r="3" fill="#0284c7"/>
        <circle cx="12" cy="32" r="3" fill="#0284c7"/>
        <line x1="10" y1="14" x2="24" y2="22" stroke="#06b6d4" stroke-width="1.5"/>
        <line x1="24" y1="22" x2="12" y2="32" stroke="#06b6d4" stroke-width="1.5"/>
      </g>

      <text x="66" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Context &amp; AST</text>
      <text x="66" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#0284c7">Topology Truth</text>

      <!-- Operation Badges -->
      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="48" height="20" rx="4" fill="#f1f5f9"/>
        <text x="6" y="14" font-family="monospace" font-size="10" fill="#475569">query</text>

        <rect x="54" y="0" width="54" height="20" rx="4" fill="#f1f5f9"/>
        <text x="60" y="14" font-family="monospace" font-size="10" fill="#475569">explain</text>

        <rect x="114" y="0" width="42" height="20" rx="4" fill="#f1f5f9"/>
        <text x="120" y="14" font-family="monospace" font-size="10" fill="#475569">path</text>
      </g>
    </g>
  </g>
</svg>
