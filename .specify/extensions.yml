extensions:
  gss-bridge:
    id: gss-bridge
    name: "GSS-Bridge: Graphify + Spec-Kit + Superpowers"
    version: "1.1.0"
    path: ".specify/extensions/gss-bridge"
    enabled: true

hooks:
  before_clarify:
    - extension: gss-bridge
      command: speckit.gss-bridge.guard
      optional: false
  before_plan:
    - extension: gss-bridge
      command: speckit.gss-bridge.guard
      optional: false
  before_tasks:
    - extension: gss-bridge
      command: speckit.gss-bridge.guard
      optional: false
  before_implement:
    - extension: gss-bridge
      command: speckit.gss-bridge.guard
      optional: false
  after_tasks:
    - extension: gss-bridge
      command: speckit.gss-bridge.handoff
      optional: false
  before_bug_assess:
    - extension: gss-bridge
      command: speckit.gss-bridge.guard
      optional: true
  before_bug_fix:
    - extension: gss-bridge
      command: speckit.gss-bridge.guard
      optional: false
